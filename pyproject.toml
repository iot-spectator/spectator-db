[project]
name = "spectator-db"
version = "0.2.0"
authors = [
    {name="IoT Spectator", email="shun@formosa1544.com"}
]
description = "A database for storing and managing images and videos."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "MIT License"}
dependencies = []

[project.optional-dependencies]
# Richer EXIF parsing (HEIC and formats the zero-dep reader can't handle).
# The core never imports Pillow; it is only used when this extra is installed.
exif = ["Pillow>=10.0"]

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.setuptools.package-data]
spectatordb = ["py.typed"]

[project.urls]
repository = "https://github.com/iot-spectator/spectator-db"
